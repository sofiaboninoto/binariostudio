<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binario Studio — Il mio percorso verso il prossimo lavoro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e05b5b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binario studio">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2433;--muted:#707887;--line:#e3e6eb;
  --accent:#315efb;--accent2:#6c5ce7;--green:#20a36a;--yellow:#f0a51a;
  --red:#e05b5b;--shadow:0 8px 28px rgba(20,30,50,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.app{max-width:1400px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
h1{font-size:30px;margin:0 0 4px}.subtitle{color:var(--muted)}
.today{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;white-space:nowrap}
.main-nav{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.main-nav button{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;font-weight:700;white-space:nowrap}
.main-nav button.active{background:var(--text);color:white;border-color:var(--text)}
.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:minmax(430px,1.05fr) minmax(430px,.95fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.card h2{font-size:18px;margin:0 0 14px}
